name: Update and Group JSON API

on:
  push:
    branches: [main]
    # Не перезапускать workflow на bot-коммиты с JSON (избегаем лишних прогонов).
    paths-ignore:
      - 'public/api/**'
      - 'manifestIdUpdate.txt'
      - 'manifestIdGroup.txt'
      - 'imagesShaUpdate.txt'
      - 'imagesShaGroup.txt'
  # Авто-запуск каждые 3 часа. Большинство запусков выйдут на быстром
  # manifest-check (update.js рано exit'ит если manifestIdUpdate.txt совпадает
  # с upstream — нет новых данных). Полноценная регенерация ~1-2 мин только
  # когда Valve выпускает патч.
  schedule:
    - cron: '0 */3 * * *'
  repository_dispatch:
    types: [game-images-updated]
  workflow_dispatch:
    inputs:
      force:
        description: "Force download (ignore existing files)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-group:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm install
      
      # Update step
      - name: Update data
        id: update-data
        run: npm run ${{ github.event.inputs.force == 'true' && 'update-data-force' || 'update-data' }}
      
      - name: Read manifestIdUpdate.txt
        id: manifestIdUpdate
        uses: juliangruber/read-file-action@v1
        with:
          path: ./manifestIdUpdate.txt
      
      # Group step
      - name: Group data
        id: group-data
        run: npm run ${{ github.event.inputs.force == 'true' && 'group-data-force' || 'group-data' }}
      
      - name: Read manifestIdGroup.txt
        id: manifestIdGroup
        uses: juliangruber/read-file-action@v1
        with:
          path: ./manifestIdGroup.txt
      
      # Commit all changes
      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[bot::update-group] manifest ${{ steps.manifestIdUpdate.outputs.content }}"
